$schema: 'https://raw.githubusercontent.com/context-hub/generator/refs/heads/main/json-schema.json'

import:
  - path: src/**/context.yaml
  - path: prompts.yaml

documents:
  - description: "Method Call Stack Analysis"
    outputPath: "method-call-stack.md"
    sources:
            -   type: trace
                description: >-
                    A comprehensive method call stack analysis for the TreeSourceFetcher::fetch method.
                    This analysis generates a hierarchical tree visualization of all method calls,
                    showing the execution flow and dependencies between different components of the system.
                    The analysis excludes vendor libraries and framework code to focus on the application logic.
                sourcePaths:
                    - src
                options:
                    startFile: "src/Source/Tree/TreeSourceFetcher.php"
                    class: "Butschster\\ContextGenerator\\Source\\Tree\\TreeSourceFetcher"
                    method: "fetch"
                    # Skip options

                    skipVendorDir: true
                    skipFrameworks: true
                    skipSingletonMethods: true
                    skipConstructors: false
                    skipInvokeMethods: false
                    # Directories and classes to skip
                    skipDirs:
                        - tests
                        - vendor/symfony
                    skipClasses:
                        - Monolog\\Logger
                        - Symfony\\Component\\Console

                        # Methods to skip
                    skipMethods:
                        - debug
                        - log
                        - getLogger

                        # Patterns for singleton methods
                    singletonMethodPatterns:
                        - /^getInstance$/
                        - /^instance$/
                        - /^get[A-Z][a-zA-Z0-9]*Instance$/
                        - /^create[A-Z][a-zA-Z0-9]*$/

                        # Analysis depth
                    maxDepth: 20

                    # File filtering
                    filePattern: "*.php"
                    notPath:
                        - "/vendor/"
                        - "/tests/"
                    path:
                        - "src/Source"
                        - "src/Lib"

                        # Content filtering
                    contains: [ ]
                    notContains: [ ]

                    # Rendering format
                    renderFormat: "markdown"

                    # Tags for organization
                    tags:
                        - "code-analysis"
                        - "method-calls"
                        - "trace"

  -   description: 'Project structure overview'
      outputPath: tree_project-structure.md
      overwrite: true
      sources:
          -   type: tree
              sourcePaths:
                  - src/Source/Tree
              showCharCount: true
              filePattern: '*.php'
              showSize: true
          - type: file

  - description: 'Project structure overview'
    outputPath: project-structure.md
    overwrite: true
    sources:
      - type: tree
        sourcePaths:
          - src
        showCharCount: true
        showSize: true

  - description: Core Interfaces
    outputPath: core/interfaces.md
    sources:
      - type: file
        sourcePaths: src
        filePattern:
          - '*Interface.php'
        showTreeView: true


  - description: "PHP Method Call Stack Analysis from XHProf"
    outputPath: "xhprof-call-stack.md"
    sources:
              -   type: xhprof_trace
                  description: >-
                      A comprehensive method call analysis from XHProf trace data.
                      This visualization shows performance metrics and call relationships
                      for functions executed during the request.
                  sourcePaths:
                      - src/Source/XHProfTrace/trace.json
                  options:
                      title: "PHP Method Call Stack Trace Analysis"
                      maxDepth: 15  # Maximum depth of call tree to display
                      showMemory: true  # Show memory usage metrics
                      showCpuTime: true  # Show CPU time metrics
                  tags:
                      - "performance"
                      - "profiling"
                      - "method-calls"
